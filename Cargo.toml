[package]
name = "poker_engine"
description = "A high-performance, modular, and feature-complete No-Limit Texas Hold'em (NLHE) poker engine written in idiomatic Rust."
authors = ["Nawasan <zocketzero@proton.me>"]
version = "0.0.1"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ZocketZero/poker-engine"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
